[package]
name = "mm-dream"
version = "0.2.0"
edition = "2021"
description = "GPU-accelerated kaleidoscope screensaver — libcosmic + WGSL"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["winit", "wayland", "wgpu"]
